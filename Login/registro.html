<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexWeb - Acceso</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-logo">
            <img src="../img/logo-nexweb.jpg" alt="Logotipo NexWeb" style="width: 120px; height: auto;">
        </div>
        <h2>Bienvenido a NexWeb</h2>
        <form>
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p class="auth-redirect">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <p style="margin-top: 15px;"><a href="../index.html" style="color: #666; text-decoration: none;">← Volver a la tienda</a></p>
    </div>
</body>
</html>

    <script src="login.js"></script>
</body>

</html>
