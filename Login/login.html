<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | NexWeb</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="contenedor">
        <div class="login">
            <!-- Enlace para regresar a la página principal -->
            <a href="../Inicio/index.html" class="volver">← Volver al inicio</a>

            <!-- Logotipo de NexWeb -->
            <div style="text-align: center; margin-bottom: 15px;">
                <img src="../img/logo-nexweb.jpg" alt="Logotipo NexWeb" style="width: 90px; height: auto; border-radius: 8px;">
            </div>

            <h1>NexWeb</h1>
            <h2>Iniciar sesión</h2>
            <p class="subtitulo">Ingresa a tu cuenta para continuar</p>

            <form>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

                <button type="submit">Iniciar sesión</button>
            </form>

            <p class="registro">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>
        </div>
    </div>

    <script src="../js/nexweb.js"></script>
    <script src="login.js"></script>
</body>
</html>
